# Publishes to npm with a provenance statement (required for n8n community nodes) when a version tag is pushed:
#   npm version patch && git push --follow-tags
# npm can't set up trusted publishing before a package exists, so the first version is published with a short-lived
# token in the NPM_TOKEN secret. After that: npmjs.com → package settings → Trusted publisher → GitHub Actions, this
# repository, workflow "publish.yml"; then delete the token and the secret. npm uses the trusted publisher first.
name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
